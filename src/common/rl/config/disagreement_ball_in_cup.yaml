# Disagreement exploration on dm_control's ball-in-cup (planar JAX/MJX port).
#   python -m core_rl.train --robot parol6 --task ball_in_cup --algo disagreement --config <this file>
# (--robot is required by train.py but ignored by the ball_in_cup task.)
#
# Pure exploration: the policy trains on the ensemble-disagreement reward only
# (ext_coeff = 0). The sparse env reward ("caught") is reported by the Brax
# evaluator untouched, so eval/episode_reward and eval/episode_caught measure
# exploration quality without ever being trained on — the paper's protocol.

training:
  total_timesteps: 2_000_000
  num_envs: 4096
  seed: 42

env:
  max_episode_steps: 200
  control_dt: 0.02            # dm_control control timestep (50 Hz)
  physics_dt: 0.002           # dm_control / MuJoCo default timestep → n_frames=10
  backend: mjx
  task_kwargs:
    ball_in_cup:
      # Absolute path to the model (carried in config, not hardcoded in source).
      xml_path: /ros2_ws/core/src/ball_in_cup/ball_in_cup.xml
      # Deterministic hard start: ball at rest hanging straight down. A catch
      # then requires a deliberate swing-up (random ≈ never), so time-to-first-
      # success is a real exploration signal. Keep identical across all arms.
      hard_init: true

algorithms:
  disagreement:
    learning_rate: 3.0e-4
    unroll_length: 20
    num_minibatches: 32
    num_updates_per_batch: 4
    discounting: 0.99
    gae_lambda: 0.95
    clipping_epsilon: 0.2
    entropy_cost: 1.0e-3
    vf_loss_coefficient: 0.5
    max_grad_norm: 0.5
    normalize_observations: true
    reward_scaling: 1.0
    network_factory_kwargs:
      hidden_layer_sizes: [256, 256]

    num_models: 5
    ensemble_hidden_layer_sizes: [256, 256]
    ensemble_lr: 3.0e-4
    ensemble_train_steps: 4
    bootstrap_keep_prob: 0.8
    int_coeff: 1.0
    ext_coeff: 0.0            # pure exploration — env reward used for EVAL only
    int_rew_ema_tau: 0.05
    # false = Brax default (per-env first reset cached & replayed). Set true to
    # resample the ball start every episode (matches DADS reset semantics; use
    # for a clean DADS-vs-disagreement comparison). ~1.5–2x slower. See §3.6.
    resample_on_reset: true

callbacks:
  redis:
    enabled: true
    host: redis
    port: 6379
    password: ""
  mlflow:
    enabled: true
    tracking_uri: "http://mlflow:5000"

export:
  onnx: false                 # exploration policy; no PD/robot export path
